  <text x="740" y="410" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#fff9ea"># Designing calm tools</text>
  <text x="740" y="458" font-family="Menlo, monospace" font-size="14" fill="#dce6df">Good tools help people focus on the work</text>
  <text x="740" y="482" font-family="Menlo, monospace" font-size="14" fill="#dce6df">rather than the interface around it.</text>
  <text x="740" y="534" font-family="Menlo, monospace" font-size="18" font-weight="700" fill="#fff9ea">## Useful principles</text>
  <text x="740" y="574" font-family="Menlo, monospace" font-size="14" fill="#dce6df">- Preserve context</text>
  <text x="740" y="602" font-family="Menlo, monospace" font-size="14" fill="#dce6df">- Make the next action clear</text>
